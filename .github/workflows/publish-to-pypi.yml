name: Publish to PyPI

on:
  push:
    branches:
      - 'main'
    paths:
      - 'AndroidFridaManager/about.py'
  # Allows re-publishing manually (e.g. after a failed run) without bumping the version
  workflow_dispatch:

jobs:
  build-and-publish:
    # Pinned instead of ubuntu-latest so runner image migrations cannot silently break the job
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        # Only the build interpreter; supported runtime versions are set by python_requires in setup.py
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distribution
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
